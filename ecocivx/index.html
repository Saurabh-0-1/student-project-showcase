<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCivX | Demo in Progress</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #eef2ff;
            background: #0b1020;
        }
        
        main {
            width: min(680px, 100%);
            padding: 42px;
            border: 1px solid #34415b;
            border-radius: 22px;
            background: #151e30;
        }
        
        .icon {
            font-size: 42px;
        }
        
        .label {
            display: inline-block;
            margin: 20px 0;
            padding: 8px 12px;
            border-radius: 30px;
            background: #244338;
            color: #9df2c6;
            font-size: 13px;
        }
        
        h1 {
            font-size: clamp(30px, 6vw, 46px);
            margin: 0 0 16px;
        }
        
        p {
            color: #bac7dc;
            line-height: 1.7;
        }
        
        .button {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 18px;
            border-radius: 9px;
            background: #91e5b4;
            color: #101827;
            font-weight: bold;
            text-decoration: none;
        }
        
        .button:hover {
            background: #b8f5d0;
        }
    </style>
</head>

<body>
    <main>
        <div class="icon">🌱</div>
        <div class="label">DEMO IN PROGRESS</div>
        <h1>EcoCivX</h1>
        <p>Smart Environmental and Civic Action Platform.</p>
        <p>
            This project concept focuses on environmental monitoring, pollution awareness, civic issue reporting and community participation.
        </p>
        <p>
            <strong>Focus:</strong> Web development, Python and civic technology.
        </p>
        <a class="button" href="../">← Back to Project Portfolio</a>
    </main>
</body>

</html>
